<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لمريم ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Cairo',sans-serif;background:radial-gradient(ellipse at bottom,#2a0d3d 0%,#0a0217 55%,#000 100%)}
canvas{position:fixed;inset:0;display:block}
.shoot{position:fixed;width:140px;height:2px;background:linear-gradient(90deg,#fff,transparent);border-radius:2px;transform:rotate(-35deg);animation:shoot 1.2s linear forwards;pointer-events:none}
@keyframes shoot{from{opacity:1;translate:0 0}to{opacity:0;translate:-500px 350px}}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;cursor:pointer;transition:opacity 1s}
#start .env{font-size:80px;animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.15)}}
#start p{color:#ffd6e8;font-size:1.3rem;margin-top:14px;text-shadow:0 0 12px #ff4f9a}
#cap{position:fixed;bottom:11%;width:100%;padding:0 20px;text-align:center;color:#ffe3f0;font-family:'Aref Ruqaa',serif;font-size:1.9rem;text-shadow:0 0 18px #ff4f9a;opacity:0;transition:opacity 1s;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.5s;z-index:5}
#msg .box{max-height:82vh;overflow-y:auto;pointer-events:auto;max-width:350px;margin:20px;padding:26px 22px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,182,213,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;text-align:center;line-height:2;font-size:1.05rem;box-shadow:0 0 40px rgba(255,79,154,.3)}
#msg .name{font-family:'Aref Ruqaa',serif;font-size:2rem;color:#ff8ac0;text-shadow:0 0 15px #ff4f9a;margin-bottom:8px}
#txt{white-space:pre-line;min-height:200px}
#again{margin-top:16px;background:none;border:1px solid #ff8ac0;color:#ff8ac0;border-radius:20px;padding:6px 18px;font-family:inherit;font-size:.95rem;opacity:0;transition:opacity 1s;cursor:pointer}
</style>
</head>
<body>
<div id="start"><div class="env">💌</div><p>عندك مفاجأة.. دوسي هنا</p></div>
<div id="cap"></div>
<div id="msg"><div class="box"><div class="name">مريومة ❤️</div><div id="txt"></div><button id="again" onclick="location.reload()">شوفيها تاني ✨</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);
camera.position.z=innerWidth<700?80:60;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setClearColor(0,0);
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const visW=()=>2*camera.position.z*Math.tan(Math.PI/6)*camera.aspect;

function glowDot(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.8)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
}
const tex=glowDot(),N=7000,tmp=new THREE.Color();

const pos=new Float32Array(N*3),col=new Float32Array(N*3),vel=new Float32Array(N*3);
const cloud=new Float32Array(N*3),cloudC=new Float32Array(N*3);
for(let i=0;i<N*3;i++){cloud[i]=(Math.random()-.5)*160;pos[i]=cloud[i];cloudC[i]=.5;col[i]=.5}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const mat=new THREE.PointsMaterial({size:.75,map:tex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
const group=new THREE.Group(),pts=new THREE.Points(geo,mat);
group.add(pts);scene.add(group);

const S=1500,sp=new Float32Array(S*3);
for(let i=0;i<S*3;i++)sp[i]=(Math.random()-.5)*400;
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({size:.6,map:tex,color:'#ffe0f0',transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(stars);

function galaxy(){
  const P=new Float32Array(N*3),C=new Float32Array(N*3),R=Math.min(visW()*.5,40);
  const ci=new THREE.Color('#ffe1b3'),cm=new THREE.Color('#ff4f9a'),co=new THREE.Color('#6a5cff');
  for(let i=0;i<N;i++){
    const k=Math.pow(Math.random(),1.5),r=k*R,a=(i%3)*2*Math.PI/3+k*5,sc=R*.12*(1-k*.5);
    P[i*3]=Math.cos(a)*r+(Math.random()-.5)*sc;
    P[i*3+1]=(Math.random()-.5)*2*(1-k);
    P[i*3+2]=Math.sin(a)*r+(Math.random()-.5)*sc;
    k<.5?tmp.copy(ci).lerp(cm,k*2):tmp.copy(cm).lerp(co,(k-.5)*2);
    C[i*3]=tmp.r;C[i*3+1]=tmp.g;C[i*3+2]=tmp.b;
  }
  return {P,C,kind:'galaxy'};
}
function heart(){
  const P=new Float32Array(N*3),C=new Float32Array(N*3),s0=Math.min(1,visW()*.85/34);
  const c1=new THREE.Color('#ff2d7a'),c2=new THREE.Color('#c77dff');
  for(let i=0;i<N;i++){
    const t=Math.random()*Math.PI*2,s=Math.pow(Math.random(),.35);
    P[i*3]=16*Math.pow(Math.sin(t),3)*s*s0;
    P[i*3+1]=((13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s+2)*s0;
    P[i*3+2]=(Math.random()-.5)*10*Math.sqrt(Math.max(0,1-s*s*.9))*s0;
    tmp.copy(c1).lerp(c2,Math.random()*.7);
    C[i*3]=tmp.r;C[i*3+1]=tmp.g;C[i*3+2]=tmp.b;
  }
  return {P,C,kind:'heart'};
}
function word(str){
  const W=1200,H=500,c=document.createElement('canvas');c.width=W;c.height=H;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.font='700 300px "Aref Ruqaa"';g.textAlign='center';g.textBaseline='middle';g.direction='rtl';
  g.fillText(str,W/2,H/2);
  const tw=g.measureText(str).width,d=g.getImageData(0,0,W,H).data,list=[];
  for(let y=0;y<H;y+=3)for(let x=0;x<W;x+=3)if(d[(y*W+x)*4+3]>128)list.push(x,y);
  const sc=Math.min(visW()*.85,55)/tw,P=new Float32Array(N*3),C=new Float32Array(N*3);
  const pink=new THREE.Color('#ff6fb0'),white=new THREE.Color('#fff0f7'),n=list.length/2;
  for(let i=0;i<N;i++){
    const j=Math.floor(Math.random()*n)*2;
    P[i*3]=(list[j]-W/2)*sc+(Math.random()-.5)*.3;
    P[i*3+1]=-(list[j+1]-H/2)*sc+(Math.random()-.5)*.3;
    P[i*3+2]=(Math.random()-.5)*3;
    tmp.copy(pink).lerp(white,Math.random()*.6);
    C[i*3]=tmp.r;C[i*3+1]=tmp.g;C[i*3+2]=tmp.b;
  }
  return {P,C,kind:'text'};
}

let tP=cloud,tC=cloudC,kind='idle',burst=false,ang=0,angVel=.1,my=0;
const clock=new THREE.Clock();
addEventListener('pointermove',e=>{my=e.clientY/innerHeight-.5});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const cap=document.getElementById('cap');
async function caption(t){cap.style.opacity=0;await wait(700);cap.textContent=t;cap.style.opacity=1}

async function begin(){
  const st=document.getElementById('start');
  st.onclick=null;st.style.opacity=0;setTimeout(()=>st.remove(),1000);
  try{await document.fonts.load('700 100px "Aref Ruqaa"')}catch(e){}
  const steps=[[galaxy(),'في وسط الكون ده كله...'],[word('مريم'),'في نجمة واحدة بس منوّرة دنيتي'],[heart(),'وساكنة في قلبي'],[word('بحبك'),'ومهما بعدت المسافة 🤍']];
  for(const [s,t] of steps){tP=s.P;tC=s.C;kind=s.kind;caption(t);await wait(5500)}
  cap.style.opacity=0;
  for(let i=0;i<N;i++){
    const x=pos[i*3],y=pos[i*3+1],z=pos[i*3+2],l=Math.hypot(x,y,z)||1,s=.6+Math.random()*1.4;
    vel[i*3]=x/l*s+(Math.random()-.5)*.6;vel[i*3+1]=y/l*s+(Math.random()-.5)*.6;vel[i*3+2]=z/l*s+(Math.random()-.5)*.6;
  }
  burst=true;
  await wait(1300);
  document.getElementById('msg').style.opacity=1;
  typeIt();
}
document.getElementById('start').onclick=begin;

const text=`عارف إن الأيام دي تقيلة عليكي، وإن الجبس مضايقك والقعدة في البيت خانقاكي، وعارف إني بعيد ومش قادر أكون جنبك، وده مضايقني أكتر منك.

بس ده وقت وهيعدي، وكل يوم بيقربنا من اليوم اللي هتفكي فيه الجبس وننزل نتمشى سوا، وأول خروجة عليا 😄

ولحد ما اليوم ده ييجي، أنا معاكي في كل لحظة. لو زهقتي أو اتضايقتي كلميني، أنا موجود.

ولا جبس ولا مسافة يغيروا حاجة، انتي أحلى حاجة في حياتي 🌸

خلي بالك من نفسك عشاني، وارتاحي، وسيبي الباقي عليا.

بحبك جداً ❤️`;
function typeIt(){
  const ch=Array.from(text),el=document.getElementById('txt');let i=0;
  const iv=setInterval(()=>{el.textContent=ch.slice(0,++i).join('');
    if(i>=ch.length){clearInterval(iv);document.getElementById('again').style.opacity=1}},40);
}

setInterval(()=>{
  const s=document.createElement('div');s.className='shoot';
  s.style.top=Math.random()*50+'vh';s.style.left=(40+Math.random()*70)+'vw';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1300);
},2200);

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  const p=geo.attributes.position.array,c=geo.attributes.color.array;
  const beat=kind==='heart'?1+.08*Math.pow(Math.abs(Math.sin(t*2)),6):1;
  for(let i=0;i<N*3;i++){
    if(!burst){p[i]+=(tP[i]*beat-p[i])*.045;c[i]+=(tC[i]-c[i])*.04}
    else{p[i]+=vel[i];vel[i]*=.985}
  }
  if(burst&&mat.opacity>.25)mat.opacity-=.004;
  geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
  const spin={idle:.1,galaxy:.3,heart:.7,text:0}[kind];
  angVel+=(spin-angVel)*.03;ang+=angVel*dt;
  if(kind==='text'){const g=Math.round(ang/(2*Math.PI))*2*Math.PI+Math.sin(t*.8)*.25;ang+=(g-ang)*.04}
  group.rotation.y=ang;
  group.rotation.x+=((kind==='galaxy'?.9:0)+my*.3-group.rotation.x)*.04;
  stars.rotation.y=t*.02;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
